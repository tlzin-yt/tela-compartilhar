<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniCall - Chamadas Direct</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Firebase App & Auth SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaaXQzO3XgcpToTSjIoCc5AjsrtJDPxyU",
      authDomain: "omnicall-b2c87.firebaseapp.com",
      projectId: "omnicall-b2c87",
      storageBucket: "omnicall-b2c87.firebasestorage.app",
      messagingSenderId: "381254948207",
      appId: "1:381254948207:web:6eeb6839cb9e8a0b89449a",
      measurementId: "G-7GM9CNWP48"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    window.auth = auth;
    window.signInWithGoogle = async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        window.handleAuthSuccess({
          name: user.displayName || 'Usuário',
          email: user.email,
          avatar: user.photoURL || ''
        });
      } catch (error) {
        if (error.code !== 'auth/cancelled-popup-request') {
          alert("Erro no login com Google: " + error.message);
        }
      }
    };

    window.loginWithEmail = async (email, password) => {
      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        const user = result.user;
        window.handleAuthSuccess({
          name: user.displayName || user.email.split('@')[0],
          email: user.email,
          avatar: user.photoURL || ''
        });
      } catch (error) {
        alert("Erro ao entrar: " + error.message);
      }
    };

    window.registerWithEmail = async (email, password) => {
      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        const user = result.user;
        window.handleAuthSuccess({
          name: user.email.split('@')[0],
          email: user.email,
          avatar: ''
        });
      } catch (error) {
        alert("Erro ao registrar: " + error.message);
      }
    };

    window.logoutUser = async () => {
      await signOut(auth);
      localStorage.removeItem('omnicall_user');
      window.location.reload();
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const savedUser = localStorage.getItem('omnicall_user');
        let avatar = user.photoURL || '';
        let name = user.displayName || user.email.split('@')[0];

        if (savedUser) {
          try {
            const parsed = JSON.parse(savedUser);
            if (parsed.avatar) avatar = parsed.avatar;
            if (parsed.name) name = parsed.name;
          } catch(e){}
        }

        window.handleAuthSuccess({
          name: name,
          email: user.email,
          avatar: avatar
        });
      } else {
        document.getElementById('step-auth').classList.remove('hidden');
        document.getElementById('step-profile').classList.add('hidden');
        document.getElementById('step-room').classList.add('hidden');
        document.getElementById('step-call').classList.add('hidden');
      }
    });
  </script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen overflow-hidden flex flex-col justify-center items-center select-none">

  <!-- CABEÇALHO SUPERIOR FIXO -->
  <header class="w-full bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between absolute top-0 left-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-bold shadow-md shadow-emerald-500/20">
        <i class="fa-solid fa-phone"></i>
      </div>
      <span class="font-bold text-slate-900 text-base tracking-tight">OmniCall</span>
    </div>
    <button id="btn-header-logout" onclick="window.logoutUser()" class="hidden px-3 py-1.5 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition">
      <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
    </button>
  </header>

  <!-- ETAPA 1: LOGIN -->
  <div id="step-auth" class="w-full max-w-sm px-4">
    <div class="bg-white border border-slate-200 p-6 md:p-8 rounded-2xl shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 bg-emerald-500 text-white rounded-2xl flex items-center justify-center text-xl mx-auto shadow-md shadow-emerald-500/20">
          <i class="fa-solid fa-phone"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Entrar no OmniCall</h2>
        <p class="text-xs text-slate-500">Faça login para criar ou entrar numa chamada.</p>
      </div>

      <button onclick="window.signInWithGoogle()" class="w-full py-2.5 px-4 bg-white hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-sm transition border border-slate-300 flex items-center justify-center space-x-3 shadow-sm active:bg-slate-100">
        <i class="fa-brands fa-google text-lg text-rose-500"></i>
        <span>Entrar com a Conta Google</span>
      </button>

      <div class="flex items-center my-3">
        <div class="flex-1 border-t border-slate-200"></div>
        <span class="px-3 text-[11px] text-slate-400 font-bold uppercase">ou e-mail</span>
        <div class="flex-1 border-t border-slate-200"></div>
      </div>

      <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">E-mail</label>
          <input type="email" id="auth-email" required placeholder="seu@email.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha</label>
          <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button type="button" onclick="handleRegister()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition">Criar Conta</button>
          <button type="submit" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs transition shadow-sm">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ETAPA 2: ESCOLHER PERFIL -->
  <div id="step-profile" class="hidden w-full max-w-sm px-4">
    <div class="bg-white border border-slate-200 p-6 md:p-8 rounded-2xl shadow-xl space-y-6">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-slate-900">Configure seu Perfil</h2>
        <p class="text-xs text-slate-500">Defina como os outros participantes vão te ver.</p>
      </div>

      <div class="flex flex-col items-center space-y-3">
        <div class="relative w-24 h-24">
          <img id="profile-preview-img" src="" class="w-24 h-24 rounded-full object-cover border-4 border-emerald-500 hidden">
          <div id="profile-preview-fallback" class="w-24 h-24 rounded-full bg-slate-100 border-4 border-slate-200 flex items-center justify-center font-bold text-slate-600 text-3xl">?</div>
        </div>

        <label class="cursor-pointer px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border border-slate-200 transition flex items-center space-x-2">
          <i class="fa-solid fa-image text-emerald-600 text-sm"></i>
          <span>Escolher Foto da Galeria</span>
          <input type="file" id="file-input-gallery" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        </label>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Seu Nome / Apelido</label>
        <input type="text" id="profile-name-input" placeholder="Como quer ser chamado..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 font-medium">
      </div>

      <button onclick="confirmProfile()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-sm transition shadow-md shadow-emerald-500/20">
        Avançar <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>

  <!-- ETAPA 3: SALA / ANFITRIÃO OU LINK -->
  <div id="step-room" class="hidden w-full max-w-sm px-4">
    <div class="bg-white border border-slate-200 p-6 md:p-8 rounded-2xl shadow-xl space-y-6">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-emerald-500 text-white rounded-2xl flex items-center justify-center text-xl mx-auto shadow-md shadow-emerald-500/20 mb-2">
          <i class="fa-solid fa-video"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Iniciar Chamada</h2>
        <p class="text-xs text-slate-500">Crie uma nova sala ou digite o código recebido do anfitrião.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Código da Sala</label>
          <input type="text" id="room-code-input" placeholder="Ex: sala-12345" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 font-semibold tracking-wide">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="generateRandomRoomCode()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border border-slate-200 transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-dice"></i>
            <span>Gerar Código</span>
          </button>
          <button onclick="startOrJoinCall()" class="py-2.5 px-3 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-xl transition shadow-md shadow-emerald-500/20 flex items-center justify-center space-x-1">
            <i class="fa-solid fa-phone"></i>
            <span>Entrar na Call</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ETAPA 4: TELA DA CALL -->
  <div id="step-call" class="hidden fixed inset-0 bg-slate-950 flex flex-col z-30">
    <!-- Topbar da Call -->
    <div class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span id="connection-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <div>
          <h3 id="current-room-title" class="font-bold text-white text-sm">Sala: -</h3>
          <p class="text-xs text-slate-400"><span id="connection-status-text">Conectando...</span> • <span id="participant-count">1</span> pessoa(s)</p>
        </div>
      </div>
      <button onclick="copyInviteLink()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
        <i class="fa-solid fa-link text-emerald-400"></i>
        <span>Copiar Link do Anfitrião</span>
      </button>
    </div>

    <!-- Grid de Vídeos -->
    <div id="video-grid" class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 p-4 overflow-y-auto items-center justify-center">
      <div id="local-video-container" class="relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden aspect-video flex items-center justify-center shadow-2xl">
        <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
        <div id="local-avatar-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 space-y-2 hidden">
          <img id="local-placeholder-img" src="" class="w-24 h-24 rounded-full object-cover border-2 border-emerald-500 hidden">
          <div id="local-placeholder-fallback" class="w-24 h-24 rounded-full bg-slate-800 border-2 border-emerald-500 flex items-center justify-center text-3xl font-bold text-white">?</div>
        </div>
        <div class="absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-semibold text-white">
          <span id="local-label-name">Você</span>
        </div>
      </div>
    </div>

    <!-- Barra de Controles da Call -->
    <div class="bg-slate-900 border-t border-slate-800 py-4 px-6 flex items-center justify-center space-x-4">
      <button id="btn-toggle-mic" onclick="toggleMic()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition text-lg">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button id="btn-toggle-cam" onclick="toggleCam()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition text-lg">
        <i class="fa-solid fa-video"></i>
      </button>
      <button id="btn-toggle-screen" onclick="toggleScreenShare()" class="w-12 h-12 rounded-full bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/30 flex items-center justify-center transition text-lg" title="Compartilhar Tela">
        <i class="fa-solid fa-desktop"></i>
      </button>
      <button onclick="leaveCall()" class="w-12 h-12 rounded-full bg-rose-600 hover:bg-rose-700 text-white flex items-center justify-center transition text-lg shadow-lg shadow-rose-600/30" title="Sair da Chamada">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

  <script>
    let currentUser = { name: '', avatar: '', email: '', peerId: '' };
    
    let peer = null;
    let localStream = null;
    let screenStream = null;
    let currentRoomCode = null;
    let activeConnections = {};
    let remoteProfiles = {};

    let isMicMuted = false;
    let isCamOff = false;
    let isSharingScreen = false;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    };

    window.handleAuthSuccess = function(userData) {
      currentUser.name = userData.name || '';
      currentUser.email = userData.email || '';
      if (userData.avatar) currentUser.avatar = userData.avatar;

      const savedUser = localStorage.getItem('omnicall_user');
      if (savedUser) {
        try {
          const u = JSON.parse(savedUser);
          if (u.name) currentUser.name = u.name;
          if (u.avatar) currentUser.avatar = u.avatar;
        } catch(e){}
      }

      document.getElementById('step-auth').classList.add('hidden');
      document.getElementById('btn-header-logout').classList.remove('hidden');

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('sala');
      if (roomParam) {
        document.getElementById('room-code-input').value = roomParam;
      }

      showStepProfile();
    };

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      window.loginWithEmail(email, pass);
    }

    function handleRegister() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      if (!email || !pass) { alert("Preencha e-mail e senha."); return; }
      window.registerWithEmail(email, pass);
    }

    function showStepProfile() {
      document.getElementById('step-profile').classList.remove('hidden');
      document.getElementById('profile-name-input').value = currentUser.name || '';
      updateProfilePreview();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxSize = 200; 
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
          } else {
            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          currentUser.avatar = canvas.toDataURL('image/jpeg', 0.6);
          updateProfilePreview();
          saveUserData();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateProfilePreview() {
      const previewImg = document.getElementById('profile-preview-img');
      const previewFallback = document.getElementById('profile-preview-fallback');
      if (currentUser.avatar) {
        previewImg.src = currentUser.avatar;
        previewImg.classList.remove('hidden');
        previewFallback.classList.add('hidden');
      } else {
        previewImg.classList.add('hidden');
        previewFallback.classList.remove('hidden');
        previewFallback.textContent = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : '?';
      }
    }

    function confirmProfile() {
      const inputName = document.getElementById('profile-name-input').value.trim();
      if (!inputName) { alert("Por favor, digite seu nome."); return; }
      currentUser.name = inputName;
      saveUserData();

      document.getElementById('step-profile').classList.add('hidden');
      document.getElementById('step-room').classList.remove('hidden');
    }

    function saveUserData() {
      localStorage.setItem('omnicall_user', JSON.stringify({ name: currentUser.name, avatar: currentUser.avatar }));
      updateLocalTileUI();
    }

    function generateRandomRoomCode() {
      const code = 'sala-' + Math.random().toString(36).substring(2, 8);
      document.getElementById('room-code-input').value = code;
    }

    async function startOrJoinCall() {
      const roomCode = document.getElementById('room-code-input').value.trim();
      if (!roomCode) { alert('Informe o código da sala ou clique em "Gerar Código".'); return; }

      currentRoomCode = roomCode;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: { echoCancellation: true, noiseSuppression: true } 
        });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        console.warn('Câmera indisponível:', err);
        localStream = new MediaStream();
      }

      updateLocalTileUI();
      initPeerMesh();

      document.getElementById('step-room').classList.add('hidden');
      document.getElementById('step-call').classList.remove('hidden');
      document.getElementById('current-room-title').textContent = 'Sala: ' + currentRoomCode;
      updateConnectionStatus('connecting', 'Conectando...');
    }

    function updateLocalTileUI() {
      document.getElementById('local-label-name').textContent = currentUser.name;
      const img = document.getElementById('local-placeholder-img');
      const fallback = document.getElementById('local-placeholder-fallback');
      if (currentUser.avatar) {
        img.src = currentUser.avatar;
        img.classList.remove('hidden');
        fallback.classList.add('hidden');
      } else {
        img.classList.add('hidden');
        fallback.classList.remove('hidden');
        fallback.textContent = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : '?';
      }
    }

    function initPeerMesh() {
      const myUniqueId = `omnicall-${currentRoomCode}-${Math.random().toString(36).substring(2, 8)}`;
      const preciseHostId = `omnicall-room-${currentRoomCode}-master`;

      peer = new Peer(peerConfig);

      peer.on('open', () => {
        const hostPeer = new Peer(preciseHostId, peerConfig);

        hostPeer.on('open', (hId) => {
          currentUser.peerId = hId;
          updateConnectionStatus('connected', 'Aguardando convidados...');
          setupPeerEvents(hostPeer);
          peer.destroy();
          peer = hostPeer;
        });

        hostPeer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            const guestPeer = new Peer(myUniqueId, peerConfig);
            guestPeer.on('open', (gId) => {
              currentUser.peerId = gId;
              updateConnectionStatus('connected', 'Entrando...');
              setupPeerEvents(guestPeer);
              connectToPeerAndSync(preciseHostId, guestPeer);
            });
            peer.destroy();
            peer = guestPeer;
          }
        });
      });
    }

    function setupPeerEvents(pInstance) {
      pInstance.on('call', (call) => {
        call.answer(localStream);
        handleIncomingStream(call);
      });

      pInstance.on('connection', (conn) => {
        setupDataReceiver(conn);
      });
    }

    function connectToPeerAndSync(targetId, pInstance) {
      const conn = pInstance.connect(targetId);
      activeConnections[targetId] = conn;

      conn.on('open', () => {
        conn.send({ type: 'join', peerId: currentUser.peerId, name: currentUser.name, avatar: currentUser.avatar });
      });

      conn.on('data', (data) => {
        handleDataMessage(data, targetId, pInstance);
      });

      const call = pInstance.call(targetId, localStream);
      if (call) handleIncomingStream(call);
    }

    function setupDataReceiver(conn) {
      const peerId = conn.peer;
      activeConnections[peerId] = conn;

      conn.on('data', (data) => {
        handleDataMessage(data, peerId, peer);
      });
    }

    function handleDataMessage(data, peerId, pInstance) {
      if (data.type === 'join') {
        remoteProfiles[data.peerId] = { name: data.name, avatar: data.avatar };
        
        if (!activeConnections[data.peerId]) {
          const call = pInstance.call(data.peerId, localStream);
          if (call) handleIncomingStream(call);

          const conn = pInstance.connect(data.peerId);
          activeConnections[data.peerId] = conn;
          conn.on('open', () => {
            conn.send({ type: 'profile', name: currentUser.name, avatar: currentUser.avatar });
          });
          conn.on('data', (d) => handleDataMessage(d, data.peerId, pInstance));
        }
      } else if (data.type === 'profile') {
        remoteProfiles[peerId] = { name: data.name, avatar: data.avatar };
        updateRemoteTileMetadata(peerId, data.name, data.avatar);
      }
    }

    function handleIncomingStream(call) {
      call.on('stream', (remoteStream) => {
        addRemoteVideo(call.peer, remoteStream);
        updateConnectionStatus('connected', 'Conectado!');
      });

      call.on('close', () => {
        removeRemoteVideo(call.peer);
      });
    }

    function addRemoteVideo(peerId, stream) {
      if (document.getElementById(`video-container-${peerId}`)) return;

      const grid = document.getElementById('video-grid');
      const container = document.createElement('div');
      container.id = `video-container-${peerId}`;
      container.className = 'relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden aspect-video flex items-center justify-center shadow-2xl';

      const video = document.createElement('video');
      video.autoplay = true;
      video.playsinline = true;
      video.srcObject = stream;
      video.className = 'w-full h-full object-cover';

      const profile = remoteProfiles[peerId] || { name: 'Participante', avatar: '' };

      const avatarDiv = document.createElement('div');
      avatarDiv.id = `remote-avatar-${peerId}`;
      avatarDiv.className = 'absolute inset-0 flex flex-col items-center justify-center bg-slate-900 space-y-2 hidden';
      avatarDiv.innerHTML = profile.avatar 
        ? `<img src="${profile.avatar}" class="w-24 h-24 rounded-full object-cover border-2 border-emerald-500">`
        : `<div class="w-24 h-24 rounded-full bg-slate-800 border-2 border-emerald-500 flex items-center justify-center text-3xl font-bold text-white">${profile.name ? profile.name.charAt(0).toUpperCase() : '?'}</div>`;

      const label = document.createElement('div');
      label.className = 'absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-semibold text-white';
      label.innerHTML = `<span id="remote-name-${peerId}">${profile.name}</span>`;

      container.appendChild(video);
      container.appendChild(avatarDiv);
      container.appendChild(label);
      grid.appendChild(container);

      updateParticipantCount();
    }

    function updateRemoteTileMetadata(peerId, name, avatar) {
      const nameEl = document.getElementById(`remote-name-${peerId}`);
      if (nameEl) nameEl.textContent = name;

      const avatarDiv = document.getElementById(`remote-avatar-${peerId}`);
      if (avatarDiv) {
        avatarDiv.innerHTML = avatar 
          ? `<img src="${avatar}" class="w-24 h-24 rounded-full object-cover border-2 border-emerald-500">`
          : `<div class="w-24 h-24 rounded-full bg-slate-800 border-2 border-emerald-500 flex items-center justify-center text-3xl font-bold text-white">${name ? name.charAt(0).toUpperCase() : '?'}</div>`;
      }
    }

    function removeRemoteVideo(peerId) {
      const container = document.getElementById(`video-container-${peerId}`);
      if (container) {
        container.remove();
        updateParticipantCount();
      }
    }

    function updateConnectionStatus(status, text) {
      const dot = document.getElementById('connection-dot');
      const statusText = document.getElementById('connection-status-text');
      if (!dot || !statusText) return;

      statusText.textContent = text;
      if (status === 'connected') {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
      } else if (status === 'connecting') {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
      }
    }

    function updateParticipantCount() {
      const count = document.getElementById('video-grid').children.length;
      document.getElementById('participant-count').textContent = count;
    }

    function toggleMic() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        isMicMuted = !audioTrack.enabled;
        const btn = document.getElementById('btn-toggle-mic');
        btn.innerHTML = isMicMuted ? '<i class="fa-solid fa-microphone-slash text-rose-500"></i>' : '<i class="fa-solid fa-microphone"></i>';
      }
    }

    function toggleCam() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        isCamOff = !videoTrack.enabled;
        const btn = document.getElementById('btn-toggle-cam');
        btn.innerHTML = isCamOff ? '<i class="fa-solid fa-video-slash text-rose-500"></i>' : '<i class="fa-solid fa-video"></i>';
        document.getElementById('local-avatar-placeholder').classList.toggle('hidden', !isCamOff);
      }
    }

    async function toggleScreenShare() {
      if (!isSharingScreen) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          const screenTrack = screenStream.getVideoTracks()[0];
          document.getElementById('local-video').srcObject = screenStream;
          isSharingScreen = true;
          screenTrack.onended = () => { stopScreenShare(); };
        } catch (err) { console.error(err); }
      } else { stopScreenShare(); }
    }

    function stopScreenShare() {
      if (screenStream) screenStream.getTracks().forEach(t => t.stop());
      document.getElementById('local-video').srcObject = localStream;
      isSharingScreen = false;
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}${window.location.pathname}?sala=${encodeURIComponent(currentRoomCode)}`;
      navigator.clipboard.writeText(inviteUrl).then(() => {
        alert('Link do anfitrião copiado!\n\nEnvie este link para os participantes entrarem direto nesta sala:\n' + inviteUrl);
      });
    }

    function leaveCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();

      document.getElementById('step-call').classList.add('hidden');
      document.getElementById('step-room').classList.remove('hidden');
      
      const grid = document.getElementById('video-grid');
      while (grid.children.length > 1) { grid.removeChild(grid.lastChild); }
      updateParticipantCount();
    }
  </script>
</body>
</html>
